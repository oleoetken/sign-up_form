<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign-Up Form</title>
</head>
<body>
    <div class="image-box">
        <img class="background" src="./david-becker-5_lSZqM4nMM-unsplash.jpg" alt="Nothern Lights">
        <div class="logo-box">
            <img class="odin-logo" src="./odin-lined.png" alt="The Odin Project Logo">
            <p class="odin-text">ODIN</p>
        </div>
        <div class="footnote">
            <p>Photo by <a href="https://unsplash.com/photos/aurora-borealis-over-a-snowy-forest-landscape-with-pine-trees-5_lSZqM4nMM">David Becker</a> on <a href="https://unsplash.com/">Unsplash</a></p>
        </div>
    </div>
    <div class="info-box"></div>
        <div class="top-box">
            <p class="first">This is not a real online service! You know you need something
                like this in your life to help you realize your deepest dreams.
            </p>
            <p class="second">Sign up <em>now</em> to get started.</p>
            <p class="third">You <em>know</em> you want to.</p>
            <form id="this-form">
                <h3>Let's do this!</h3>
                    <div class="row">
                        <div class="field">
                            <label for="first_name">First Name</label>
                            <input type="text" id="first_name" name="first_name">
                        </div>
                        <div class="field">
                            <label for="last_name">Last Name</label>
                            <input type="text" id="last_name" name="last_name">
                        </div>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div class="field">
                            <label for="phone_number">Phone Number</label>
                            <input type="tel" id="user_password" name="phone_number">
                        </div>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label for="user_password">Password</label>
                            <input type="password" id="user_password" name="user_password" required>
                        </div>
                        <div class="field">
                            <label for="user_password_confirm">Confirm Password</label>
                            <input type="password" id="user_password_confirm" name="user_password_confirm" required>
                        </div>
                    </div>
            </form>
            <div>
                <button type="submit" form="this-form">Create Account</button>
                <p class="last-note">Already have an account?<a href="" class="log-in"> Log in</a></p> 
            </div>
        </div>
</body>
</html>
